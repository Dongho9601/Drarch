<svg xmlns="http://www.w3.org/2000/svg" class="drarch-diagram" width="1456" height="685" viewBox="0 0 1456 685" role="img" aria-label="QueueSchedulerPE architecture diagram">
<title>QueueSchedulerPE</title>
<desc>A request queue decouples arrivals from a four-wide scheduler. The scheduler signals backpressure upstream.</desc>
<style>
  .drarch-diagram { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #25292e; }
  .drarch-diagram .block-shape { fill: #fff; stroke: #434a52; stroke-width: 1.2; }
  .drarch-diagram .component-compute .block-shape { fill: #fcf7ed; stroke: #806537; }
  .drarch-diagram .component-memory .block-shape { fill: #f0f5fa; stroke: #526e90; }
  .drarch-diagram .component-queue .block-shape { fill: #f1f7f4; stroke: #53796d; }
  .drarch-diagram .component-buffer .block-shape { fill: #f5f8ef; stroke: #71834e; }
  .drarch-diagram .component-generic .block-shape { fill: #fafafa; stroke: #69717c; }
  .drarch-diagram .component-crossbar .block-shape { fill: #eff7f8; stroke: #477d84; }
  .drarch-diagram .component-mux .block-shape,
  .drarch-diagram .component-demux .block-shape { fill: #fbf4f0; stroke: #926b57; }
  .drarch-diagram .component-register .block-shape { fill: #f5f6f8; stroke: #65717e; }
  .drarch-diagram .detail { fill: none; stroke: #7d8791; stroke-width: 1.2; }
  .drarch-diagram .type { font-size: 11px; letter-spacing: 1.2px; fill: #545e69; }
  .drarch-diagram .heading { font-size: 17px; font-weight: 600; fill: #25292e; }
  .drarch-diagram .property { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #424c57; }
  .drarch-diagram .topology { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #25292e; }
  .drarch-diagram .figure-title { font-size: 22px; font-weight: 600; fill: #25292e; }
  .drarch-diagram .figure-note { font-size: 13px; fill: #424c57; }
  .drarch-diagram .group-shape { fill: #fafbfc; stroke: #c1c6cc; stroke-width: 1; }
  .drarch-diagram .group-label { font-size: 15px; font-weight: 500; fill: #555e68; }
  .drarch-diagram .edge-line { fill: none; stroke: #646c76; stroke-width: 1.3; }
  .drarch-diagram .edge-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #424c57; }
  .drarch-diagram .data .edge-line { stroke: #343b44; stroke-width: 1.6; }
  .drarch-diagram .neutral .edge-line { stroke-dasharray: 14 6; }
  .drarch-diagram .request .edge-line { stroke-dasharray: 8 3; }
  .drarch-diagram .response .edge-line { stroke-dasharray: 5 3; }
  .drarch-diagram .control .edge-line { stroke-dasharray: 2 3; }
  .drarch-diagram .backpressure .edge-line { stroke-dasharray: 7 3 2 3; }
  .drarch-diagram .credit .edge-line { stroke-dasharray: 2 2 2 6; }
  .drarch-diagram .dependency .edge-line { stroke-dasharray: 1 5; }
  .drarch-diagram .edge-hit { fill: none; stroke: transparent; stroke-width: 14; }
  .drarch-diagram .related .edge-line { stroke: #215e86; stroke-width: 2; }
  .drarch-diagram .related .block-shape { stroke: #215e86; stroke-width: 1.8; }
  .drarch-diagram [data-key] { cursor: pointer; outline: none; }
  .drarch-diagram [data-key]:focus .block-shape, .drarch-diagram .selected .block-shape { stroke: #1f5d89; stroke-width: 2.76; }
  .drarch-diagram [data-key]:focus .group-shape, .drarch-diagram .selected .group-shape { stroke: #1f5d89; stroke-width: 2.4; }
  .drarch-diagram [data-key]:focus .edge-line, .drarch-diagram .selected .edge-line { stroke: #1f5d89; stroke-width: 2.76; }
</style><defs><marker id="drarch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#646c76" stroke-width="1.4" stroke-dasharray="none"/></marker><marker id="drarch-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#646c76" stroke-width="1.4" stroke-dasharray="none"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text class="figure-title" x="32" y="38">QueueSchedulerPE</text>
<g class="architecture-geometry" transform="translate(0 54)">
<g class="request">
<path class="edge-line" d="M 272 90.67 L 296 90.67 L 296 98 L 602.72 98" marker-end="url(#drarch-arrow)"/>
<rect x="344" y="67" width="186.72" height="28" fill="white"/>
<text class="edge-label" x="350" y="84">request · 4 req/cycle</text>
</g>
<g class="data">
<path class="edge-line" d="M 842.72 116 L 1032 116 L 1056 116" marker-end="url(#drarch-arrow)"/>
<rect x="914.72" y="119" width="45.28" height="28" fill="white"/>
<text class="edge-label" x="920.72" y="136">data</text>
</g>
<g class="backpressure"><title>The scheduler asks the queue to hold its next request.</title>
<path class="edge-line" d="M 602.72 134 L 296 134 L 296 141.33 L 272 141.33" marker-end="url(#drarch-arrow)"/>
<rect x="381.44" y="137" width="111.84" height="28" fill="white"/>
<text class="edge-label" x="387.44" y="154">backpressure</text>
</g>
<g class="data">
<path class="edge-line" d="M 1228 181 L 1228 353" marker-end="url(#drarch-arrow)" marker-start="url(#drarch-arrow-start)"/>
<rect x="1072.56" y="253" width="153.44" height="28" fill="white"/>
<text class="edge-label" x="1078.56" y="270">data · 32 B/cycle</text>
</g>
<g class="component-queue" transform="translate(32 40)"><title>Stores up to 32 requests. Backpressure stops new requests when the scheduler cannot accept work.</title><rect class="block-shape" width="240" height="152"/><path class="detail" d="M 14 0 V 152 M 226 0 V 152 M 0 50.666666666666664 H 14 M 0 101.33333333333333 H 14 M 226 50.666666666666664 H 240 M 226 101.33333333333333 H 240"/><text class="type" x="24" y="23">QUEUE</text>
<text class="heading" x="24" y="48">Request Queue</text>
<text class="property" x="24" y="70">Depth: 32 entries</text>
<text class="property" x="24" y="92">Input: 4 req/cycle</text>
<text class="property" x="24" y="114">Output: 4 req/cycle</text>
</g>
<g class="component-generic" transform="translate(602.72 62)"><rect class="block-shape" width="240" height="108"/><text class="type" x="24" y="23">GENERIC</text>
<text class="heading" x="24" y="48">Scheduler</text>
<text class="property" x="24" y="70">Width: 4</text>
</g>
<g class="component-compute" transform="translate(1056 51)"><path class="block-shape" d="M 20 0 H 324 L 344 20 V 110 L 324 130 H 20 L 0 110 V 20 Z"/><text class="type" x="24" y="23">COMPUTE</text>
<text class="heading" x="24" y="48">PE ×4</text>
<text class="topology" x="24" y="70">Data peers: 2 in / 1 out</text>
<text class="property" x="24" y="92">Throughput: 1 op/cycle / instance</text>
</g>
<g class="component-memory" transform="translate(1108 353)"><rect class="block-shape" width="240" height="130"/><path class="detail" d="M 0 114 H 240 M 0 122 H 240 M 60 114 V 130 M 120 114 V 130 M 180 114 V 130"/><text class="type" x="24" y="23">MEMORY</text>
<text class="heading" x="24" y="48">L2</text>
<text class="property" x="24" y="70">Capacity: 1 MB</text>
<text class="property" x="24" y="92">Latency: 8 cycle</text>
</g>
</g>
<g class="figure-legend"><path d="M 32 589 h 36" fill="none" stroke="#343b44" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#drarch-arrow)"/><text class="figure-note" x="78" y="593">Data</text></g>
<g class="figure-legend"><path d="M 131.28 589 h 36" fill="none" stroke="#646c76" stroke-width="1.3" stroke-dasharray="8 3" marker-end="url(#drarch-arrow)"/><text class="figure-note" x="177.28" y="593">Request</text></g>
<g class="figure-legend"><path d="M 255.52 589 h 36" fill="none" stroke="#646c76" stroke-width="1.3" stroke-dasharray="7 3 2 3" marker-end="url(#drarch-arrow)"/><text class="figure-note" x="301.52" y="593">Backpressure</text></g>
<text class="figure-note" x="32" y="619">Ratios show declared inputs → outputs; ? means unspecified. Peer counts show distinct connected blocks per flow, not ports or arbitration. ×N denotes repeated</text>
<text class="figure-note" x="32" y="639">instances; connections attach to the compact block.</text>
</svg>
